<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Value Chain — napell.space</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d9bf0'/><text x='50' y='68' font-size='38' font-weight='bold' text-anchor='middle' fill='%23000'>N</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="value-chain">
  <div id="nav-container"></div>

  <div class="page-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="vc_title"></h1>
      <p class="page-intro" data-i18n="vc_intro"></p>
    </div>

    <!-- Upstream -->
    <div class="section">
      <h2 class="section-title" data-i18n="vc_section_upstream"></h2>
      <p class="section-desc" data-i18n="vc_upstream_desc"></p>
    </div>

    <!-- Midstream -->
    <div class="section">
      <h2 class="section-title" data-i18n="vc_section_midstream"></h2>
      <p class="section-desc" data-i18n="vc_midstream_desc"></p>
    </div>

    <!-- Downstream -->
    <div class="section">
      <h2 class="section-title" data-i18n="vc_section_downstream"></h2>
      <p class="section-desc" data-i18n="vc_downstream_desc"></p>
    </div>

    <!-- Cross-Chain Value -->
    <div class="section">
      <h2 class="section-title" data-i18n="vc_section_cross"></h2>
      <p class="section-desc" data-i18n="vc_cross_desc"></p>
    </div>

    <!-- Value Points Grid -->
    <div class="section">
      <div class="card-grid" id="vp-grid">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Key Metrics -->
    <div class="section">
      <div class="stat-grid">
        <div class="stat-block stat-block-accent" data-tooltip="" id="vp-density">
          <div class="stat-block-value">114×</div>
          <div class="stat-block-label" data-i18n="comp_density"></div>
        </div>
        <div class="stat-block" style="border-color: var(--green);" data-tooltip="" id="vp-water">
          <div class="stat-block-value" style="color: var(--green);">95%</div>
          <div class="stat-block-label" data-i18n="comp_water"></div>
        </div>
        <div class="stat-block stat-block-warn">
          <div class="stat-block-value">3×</div>
          <div class="stat-block-label" data-i18n="vc_point_title_6"></div>
        </div>
        <div class="stat-block" style="border-color: var(--purple);">
          <div class="stat-block-value" style="color: var(--purple);">615K</div>
          <div class="stat-block-label" data-i18n="kpi_annual_output"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="js/i18n.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script>
    function renderValueChainContent(lang) {
      // Value points
      const vpGrid = document.getElementById('vp-grid');
      if (vpGrid) {
        vpGrid.innerHTML = APP_DATA.value_points.map(vp => {
          return `<div class="vp-card">
            <div class="vp-icon">${vp.icon}</div>
            <div class="vp-content">
              <h4 data-i18n="${vp.title_key}">${I18N.t(vp.title_key)}</h4>
              <p data-i18n="${vp.desc_key}">${I18N.t(vp.desc_key)}</p>
            </div>
          </div>`;
        }).join('');
      }

      // Tooltips
      const d = document.getElementById('vp-density');
      if (d) d.setAttribute('data-tooltip', I18N.t('tip_scalability'));
      const w = document.getElementById('vp-water');
      if (w) w.setAttribute('data-tooltip', I18N.t('tip_water_savings'));
    }

    if (document.readyState !== 'loading') renderValueChainContent(I18N.getLang());
    document.addEventListener('DOMContentLoaded', () => renderValueChainContent(I18N.getLang()));
  </script>
</body>
</html>
