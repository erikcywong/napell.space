<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — napell.space</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d9bf0'/><text x='50' y='68' font-size='38' font-weight='bold' text-anchor='middle' fill='%23000'>N</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=43">
</head>
<body data-page="gallery">
  <div id="nav-container"></div>

  <div class="page-content">
    <div class="page-header">
      <h1 class="page-title" data-i18n="gallery_title"></h1>
      <p class="page-intro" data-i18n="gallery_intro"></p>
    </div>

    <div class="section">
      <div class="gallery-grid" id="gallery-grid">

        <figure class="gallery-item">
          <img src="assets/img/gallery/1.jpg?v=43" alt="Aeroponic coffee seedlings" loading="lazy" onclick="openLightbox(0)">
          <figcaption data-i18n="gal_cap1"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/2.jpg?v=43" alt="Rows of coffee seedlings" loading="lazy" onclick="openLightbox(1)">
          <figcaption data-i18n="gal_cap2"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/3.jpg?v=43" alt="New leaf flush close-up" loading="lazy" onclick="openLightbox(2)">
          <figcaption data-i18n="gal_cap3"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/4.jpg?v=43" alt="Seedling height measurement" loading="lazy" onclick="openLightbox(3)">
          <figcaption data-i18n="gal_cap4"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/5.jpg?v=43" alt="Coffee plants in hydroponic cups" loading="lazy" onclick="openLightbox(4)">
          <figcaption data-i18n="gal_cap5"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/6.jpg?v=43" alt="Exhibition booth display" loading="lazy" onclick="openLightbox(5)">
          <figcaption data-i18n="gal_cap6"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/7.jpg?v=43" alt="White root system" loading="lazy" onclick="openLightbox(6)">
          <figcaption data-i18n="gal_cap7"></figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="assets/img/gallery/8.jpg?v=43" alt="Aeroponic tower planter" loading="lazy" onclick="openLightbox(7)">
          <figcaption data-i18n="gal_cap8"></figcaption>
        </figure>

      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="modal-container"></div>

  <script src="js/i18n.js?v=43"></script>
  <script src="js/data.js?v=43"></script>
  <script src="js/main.js?v=43"></script>
  <script>
    const GALLERY_SRCS = [
      'assets/img/gallery/1.jpg?v=43','assets/img/gallery/2.jpg?v=43','assets/img/gallery/3.jpg?v=43','assets/img/gallery/4.jpg?v=43',
      'assets/img/gallery/5.jpg?v=43','assets/img/gallery/6.jpg?v=43','assets/img/gallery/7.jpg?v=43','assets/img/gallery/8.jpg?v=43'
    ];
    function galleryCaption(idx) {
      const cap = document.querySelectorAll('.gallery-item figcaption')[idx];
      return cap ? cap.textContent.trim() : '';
    }
    function paintLightbox(overlay, idx) {
      overlay.dataset.index = idx;
      overlay.querySelector('img').src = GALLERY_SRCS[idx];
      overlay.querySelector('.lb-cap-text').textContent = galleryCaption(idx);
      overlay.querySelector('.lb-count').textContent = (idx + 1) + ' / ' + GALLERY_SRCS.length;
      // preload the neighbours so stepping never shows a blank frame
      [idx - 1, idx + 1].forEach((n) => {
        const j = (n + GALLERY_SRCS.length) % GALLERY_SRCS.length;
        const pre = new Image(); pre.src = GALLERY_SRCS[j];
      });
    }
    function openLightbox(idx) {
      const overlay = document.createElement('div');
      overlay.className = 'lightbox';
      overlay.id = 'lightbox';
      overlay.innerHTML = `
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <img src="${GALLERY_SRCS[idx]}" alt="">
        <div class="lightbox-cap"><span class="lb-cap-text"></span><span class="lb-count"></span></div>
        <div class="lightbox-nav">
          <button class="lightbox-btn" onclick="event.stopPropagation();lightboxStep(-1)" aria-label="Previous">&#8249;</button>
          <button class="lightbox-btn" onclick="event.stopPropagation();lightboxStep(1)" aria-label="Next">&#8250;</button>
        </div>`;
      overlay.addEventListener('click', closeLightbox);
      overlay.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      document.body.appendChild(overlay);
      paintLightbox(overlay, idx);
      requestAnimationFrame(() => overlay.classList.add('show'));
    }
    function lightboxStep(dir) {
      const overlay = document.getElementById('lightbox');
      if (!overlay) return;
      let idx = (parseInt(overlay.dataset.index, 10) + dir + GALLERY_SRCS.length) % GALLERY_SRCS.length;
      paintLightbox(overlay, idx);
    }
    function closeLightbox() {
      const overlay = document.getElementById('lightbox');
      if (!overlay) return;
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 300);
    }
    document.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('lightbox');
      if (!overlay) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxStep(-1);
      if (e.key === 'ArrowRight') lightboxStep(1);
    });
  </script>
</body>
</html>
