  <script>
    function copyWeChat() {
      const num = '+86 158 0022 2338';
      const done = () => showToast(I18N.t('contact_copied'), 'success');
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = num;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand('copy');
          done();
        } catch (e) {
          showToast(I18N.t('err_copy'), 'error');
        }
        ta.remove();
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(num).then(done).catch(fallback);
      } else {
        fallback();
      }
    }
  </script>
