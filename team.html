    .tm-stmt { background: linear-gradient(135deg, rgba(29,155,240,0.12), rgba(0,186,124,0.10), rgba(212,160,23,0.08)); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px 26px; margin: 22px 0 6px; }
