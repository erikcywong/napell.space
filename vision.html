    /* Vision page specific */
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
    .inv-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px; }

    .inv-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .inv-card.np h4 { color: var(--green); }

    .bar-chart { margin-top: 24px; }
    .bar-row { display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 12px; margin-bottom: 12px; }
    .bar-label { font-size: 13px; color: var(--text-secondary); text-align: right; }
    .bar-track { height: 26px; background: var(--bg-card); border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }

    .bar-fill.np { background: linear-gradient(90deg, #0b5c42, var(--green)); }
    .bar-val { font-size: 13px; font-weight: 700; font-family: var(--font-mono, monospace); }
    .bar-val.trad { color: var(--red); }
    .bar-val.np { color: var(--green); }
    .bar-caption { font-size: 12px; color: var(--text-muted); margin-top: 10px; }

    .fly-wrap { margin-top: 24px; overflow-x: auto; }
    .fly-wrap svg { min-width: 640px; width: 100%; height: auto; display: block; }

    .seg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
    .seg-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; border-top: 3px solid var(--accent); }
    .seg-card:nth-child(2) { border-top-color: var(--purple); }
    .seg-card:nth-child(3) { border-top-color: var(--green); }
    .seg-card:nth-child(4) { border-top-color: var(--yellow); }
    .seg-card:nth-child(5) { border-top-color: var(--orange); }
    .seg-card:nth-child(6) { border-top-color: var(--red); }
    .seg-num { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
    .seg-card h3 { font-size: 16px; color: var(--text-primary); margin: 8px 0 10px; }
    .seg-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
    .seg-io { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-color); font-size: 12px; line-height: 1.7; }
    .seg-io .io-in { color: var(--green); }
    .seg-io .io-out { color: var(--accent); }

    .bench-table td:first-child { font-weight: 600; color: var(--text-primary); white-space: nowrap; }
    .bench-table tr.np-row td { background: rgba(29, 155, 240, 0.06); border-left: 3px solid var(--accent); }

    .fin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
    .fin-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; }
    .fin-card .fin-v { font-size: 26px; font-weight: 800; color: var(--accent); font-family: var(--font-mono, monospace); }
    .fin-card .fin-v small { font-size: 14px; font-weight: 600; }
    .fin-card p { font-size: 12px; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; }

    .road { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .phase { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; position: relative; }
    .phase-num { position: absolute; top: -14px; left: 18px; background: var(--accent); color: #000; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 20px; }
    .phase h3 { font-size: 15px; color: var(--text-primary); margin: 10px 0 8px; }
    .phase p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

    .value-stroke { font-size: 11.5px; font-weight: 700; fill: #e7e9ea; }
    .value-pct { font-size: 11px; font-weight: 600; }

    .thesis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 20px; }
    .thesis-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; border-left: 3px solid var(--accent); }
    .thesis-card:nth-child(2) { border-left-color: var(--purple); }
    .thesis-card:nth-child(3) { border-left-color: var(--green); }

    .thesis-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

    }
