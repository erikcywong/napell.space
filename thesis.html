<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investor Thesis — napell.space</title>
  <meta name="description" content="napell.space investor thesis: high-frequency first, heavy assets last. AI Agent hub, zero-carbon marketplace, coffee savings bank, curve IP, trade cash flow, franchising scale — crowdfunding and REITs for capitalisation. With our four corrections to the standard play.">
  <link rel="stylesheet" href="css/style.css?v=29">
  <style>
    /* Thesis page specific */
    .thesis-statement {
      background: linear-gradient(135deg, rgba(29,155,240,0.10), rgba(124,92,255,0.10), rgba(0,186,124,0.10));
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 26px 28px;
      margin: 22px 0 8px;
    }
    .thesis-statement p { font-size: 16px; line-height: 1.75; color: var(--text-primary); font-weight: 600; }
    .thesis-statement p .hl { color: #1d9bf0; }
    .th-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 20px; }
    .th-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px; }
    .th-card h4 { font-size: 14px; margin-bottom: 8px; color: #1d9bf0; }
    .th-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
    .th-card.gold h4 { color: #d4a017; }
    .th-card.green h4 { color: var(--green); }
    .th-card.purple h4 { color: #7c5cff; }

    .th-layer { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--border-color); }
    .th-layer:last-child { border-bottom: none; }
    .th-layer-tag { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 20px; display: inline-block; }
    .th-layer-tag.hi { background: rgba(29,155,240,0.15); color: #1d9bf0; }
    .th-layer-tag.mid { background: rgba(212,160,23,0.15); color: #d4a017; }
    .th-layer-tag.lo { background: rgba(124,92,255,0.15); color: #a48bff; }
    .th-layer h4 { font-size: 14px; color: var(--text-primary); margin-bottom: 5px; }
    .th-layer p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

    .th-fly { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; }
    .th-fly span { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 14px; font-size: 12.5px; color: var(--text-primary); }
    .th-fly i { color: #1d9bf0; font-style: normal; font-weight: 700; }
    .th-fly .loop { color: #00ba7c; }

    .th-num { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border-color); }
    .th-num:last-child { border-bottom: none; }
    .th-num-badge { width: 40px; height: 40px; border-radius: 50%; background: rgba(29,155,240,0.12); border: 1.5px solid #1d9bf0; color: #1d9bf0; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .th-num h4 { font-size: 14.5px; color: var(--text-primary); margin-bottom: 6px; }
    .th-num p { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }

    .th-risks { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 20px; }
    .th-risk { background: var(--bg-card); border: 1px solid rgba(244,33,46,0.25); border-radius: var(--radius-md); padding: 16px; }
    .th-risk h4 { font-size: 13.5px; color: var(--red); margin-bottom: 7px; }
    .th-risk p { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }

    .th-road { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
    .th-phase { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px; position: relative; }
    .th-phase .ph-tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #00ba7c; margin-bottom: 8px; }
    .th-phase h4 { font-size: 14px; color: var(--text-primary); margin-bottom: 7px; }
    .th-phase p { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; }

    @media (max-width: 640px) {
      .th-layer { grid-template-columns: 1fr; }
    }
  </style>
</head>
