    .th-callout { margin-top: 20px; background: linear-gradient(135deg, rgba(212,160,23,0.10), rgba(29,155,240,0.08)); border: 1px solid rgba(212,160,23,0.32); border-radius: var(--radius-md); padding: 22px 24px; }
