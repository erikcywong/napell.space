     (Saudi Arabia) + services & local costs converted to SAR.
     Scenario: Scale B — 81 systems · 10.8 acres · 615,000 seedlings/yr
     FX basis (planning, Sep 2026): US$1 = ¥6.80 · SAR peg US$1 = 3.75

  const S = 3.75;           // SAR per USD (SAMA peg)
  const FX_NOTE = 'FX: US$1 = ¥6.80 · US$1 = SAR 3.75';

  // ─── Numeric model ───────────────────────────────────────────────
  const MODEL = {
    fob: 206237,            // Scale B equipment US$97,844 + materials US$108,393
    baselineStartupUsd: 414384, // Guangzhou startup (Scale B) in USD
    annualOutput: 615000,
    saleUsd: 3.68,
    containers: 4,
    vatPct: 0.15, dutyPct: 0.05, insPct: 0.004, packPct: 0.025, contPct: 0.03,
    oceanPerCtrUsd: 3000,
    // Table A — landed-cost build-up (rows carry basis & note text via COPY)
    A: [
      { key: 'pack' }, { key: 'origin' }, { key: 'ocean' }, { key: 'ins' },
      { key: 'dest' }, { key: 'inland' }, { key: 'broker' }, { key: 'saber' },
      { key: 'duty' }, { key: 'contingency' }
    ],
    // Table B — one-off services converted to Riyadh (mid estimate)
    B: [
      { usd: 32000, lo: 26000, hi: 38000 },
      { usd: 18000, lo: 14000, hi: 22000 },
      { usd: 30000, lo: 20000, hi: 40000 },
      { usd:  6000, lo:  4000, hi:  8000 },
      { usd:  5000, lo:  3500, hi:  6500 },
      { usd:  4000, lo:  2500, hi:  6000 },
      { usd: 12000, lo:  9000, hi: 15000 }
    ],
    // Table C — per-seedling conversion (base CNY cost × factor → Riyadh)
    C: [
      { base: 1.700, f: 1.05 },   // seeds
      { base: 0.500, f: 1.10 },   // coir & packaging
      { base: 1.000, f: 0.60 },   // utilities (KSA power/water cheaper)
      { base: 1.064, f: 1.21 },   // equipment depreciation (landed uplift)
      { base: 0.350, f: 1.30 },   // misc & labor (Riyadh premium)
      { base: 2.000, f: 1.00 }    // last-mile shipping
    ]
  };

  // Derived amounts
  const fob = MODEL.fob;
  const pack = fob * MODEL.packPct;
  const cif = fob + MODEL.containers * MODEL.oceanPerCtrUsd;
  const ins = cif * MODEL.insPct;
  const ocean = MODEL.containers * MODEL.oceanPerCtrUsd;
  const duty = (cif + ins) * MODEL.dutyPct;
  const baseBeforeCont = fob + pack + 1200 + ocean + ins + 1320 + 3200 + 533 + 900;
  const contingency = baseBeforeCont * MODEL.contPct;
  const A_LINES = [pack, 1200, ocean, ins, 1320, 3200, 533, 900, duty, contingency];
  const A_SUB = A_LINES.reduce((a, b) => a + b, 0);              // landed delta
  const A_VAT = (cif + ins + duty) * MODEL.vatPct;
  const LANDED = fob + A_SUB;                                     // landed total
  const B_SUB = MODEL.B.reduce((a, r) => a + r.usd, 0);
  const C_NEW = MODEL.C.reduce((a, r) => a + r.base * r.f, 0);    // CNY subtotal
  const AMORT_USD = B_SUB / 5 / MODEL.annualOutput;               // 5-yr amort.
  const AMORT_CNY = AMORT_USD * U;
  const TOTAL_CNY = C_NEW + AMORT_CNY;
  const TOTAL_USD = TOTAL_CNY / U;
  const TOTAL_SAR = TOTAL_USD * S;
  const BASE_TOTAL_CNY = MODEL.C.reduce((a, r) => a + r.base, 0);
  const MARGIN = (MODEL.saleUsd - TOTAL_USD) / MODEL.saleUsd * 100;
  const STARTUP_RIYADH = MODEL.baselineStartupUsd + (A_SUB) + B_SUB;
  const UPLIFT = (STARTUP_RIYADH / MODEL.baselineStartupUsd - 1) * 100;

  // ─── Format helpers ──────────────────────────────────────────────
  const fm2 = n => n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const f0  = n => Math.round(n).toLocaleString('en-US');
  const cp  = n => {
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
    if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.?0+$/, '') + 'K';
    return n.toFixed(2).replace(/\.?0+$/, '');
  };

  /* ─── Render ─────────────────────────────────────────────────── */
  function renderRiyadhContent(lang) {
    const root = document.getElementById('riyadh-root');
    if (!root) return;
    const L = COPY[lang] || COPY.en;

    const money3 = (usd, dec = 0) => {
      const s = usd * S, c = usd * U;
      const ds = dec ? fm2(s) : f0(s);
      const du = dec ? fm2(usd) : f0(usd);
      const dc = dec ? fm2(c) : f0(c);
      return `<span class="ry-main">SAR ${ds}</span><span class="ry-ref">US$${du} · ¥${dc}</span>`;
    };
    const cnyCell = (cny) => {
      const u = cny / U, s = cny / U * S;
      return `<span class="ry-main">SAR ${fm2(s)}</span><span class="ry-ref">US$${fm2(u)} · ¥${fm2(cny)}</span>`;
    };
    const factPill = (f) => {
      const cls = f < 1 ? 'ry-fac ry-fac-down' : f > 1.001 ? 'ry-fac ry-fac-up' : 'ry-fac ry-fac-eq';
      return `<span class="${cls}">×${fm2(f)}</span>`;
    };

    const rowA = (i) => `
      <tr>
        <td>${L.Arows[i]}</td>
        <td class="num">US$${f0(A_LINES[i])}</td>
        <td class="num">${money3(A_LINES[i])}</td>
        <td class="note">${L.Anotes[i]}</td>
      </tr>`;

    const rowB = (r, i) => `
      <tr>
        <td>${L.Brows[i]}</td>
        <td class="num">US$${f0(r.usd)}<span class="ry-ref">${f0(r.lo)}–${f0(r.hi)}</span></td>
        <td class="num">${money3(r.usd)}</td>
        <td class="note">${L.Bnotes[i]}</td>
      </tr>`;

    const rowC = (r, i) => {
      const newCny = r.base * r.f;
      const gzUsd = r.base / U, gzSar = r.base / U * S;
      const ry = cnyCell(newCny);
      return `
      <tr>
        <td>${L.CrowLab[i]}</td>
        <td class="num">US$${fm2(gzUsd)}<span class="ry-ref">SAR ${fm2(gzSar)} · ¥${fm2(r.base)}</span></td>
        <td class="num">${factPill(r.f)}</td>
        <td class="num">${ry}</td>
      </tr>`;
    };

    const cTotal = cnyCell(TOTAL_CNY);
    const baseTotalUsd = BASE_TOTAL_CNY / U;
    const cBase = cnyCell(BASE_TOTAL_CNY);

    root.innerHTML = `
      <a class="ry-back" href="costs.html">${L.back}</a>

      <div class="page-header" style="margin-bottom: 28px;">
        <h1 class="page-title">${L.title}</h1>
        <p class="page-intro">${L.intro}</p>
      </div>

      <!-- FX + Corridor -->
      <div class="section">
        <h2 class="section-title" style="font-size: 18px;">${L.fxTitle}</h2>
        <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); margin-bottom: 22px;">
          ${L.fx.map(f => `
            <div class="card ry-fx">
              <div class="ry-fx-t">${f.t}</div>
              <div class="ry-fx-v">${f.v}</div>
              <div class="ry-fx-n">${f.n}</div>
            </div>`).join('')}
        </div>
        <h2 class="section-title" style="font-size: 18px;">${L.routeTitle}</h2>
        <div class="ry-route">
          ${L.route.map((r, i) => `
            ${i ? '<span class="ry-route-arr">→</span>' : ''}
            <span class="ry-route-step">${r}</span>`).join('')}
        </div>
      </div>

      <!-- Table A -->
      <div class="section">
        <h2 class="section-title">${L.secA}</h2>
        <p class="section-desc">${L.secAdesc}</p>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>${L.hItem}</th><th class="num">${L.hUsd}</th><th class="num">${L.hSar}</th><th>${L.hNote}</th>
            </tr></thead>
            <tbody>
              ${MODEL.A.map((_, i) => rowA(i)).join('')}
              <tr class="subtotal"><td>${L.A_sub}</td><td class="num">US$${f0(fob + A_SUB)}</td><td class="num">${money3(fob + A_SUB)}</td><td class="note">FOB US$${f0(fob)} + ${f0(A_SUB)}</td></tr>
              <tr class="ry-vat-row"><td>${L.A_vat}</td><td class="num">US$${f0(A_VAT)}</td><td class="num">${money3(A_VAT)}</td><td class="note"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Table B -->
      <div class="section">
        <h2 class="section-title">${L.secB}</h2>
        <p class="section-desc">${L.secBdesc}</p>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>${L.hItem}</th><th class="num">${L.hUsd}</th><th class="num">${L.hSar}</th><th>${L.hNote}</th>
            </tr></thead>
            <tbody>
              ${MODEL.B.map((r, i) => rowB(r, i)).join('')}
              <tr class="grand-total"><td>${L.B_sub}</td><td class="num">US$${f0(B_SUB)}</td><td class="num">${money3(B_SUB)}</td><td class="note"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Table C -->
      <div class="section">
        <h2 class="section-title">${L.secC}</h2>
        <p class="section-desc">${L.secCdesc}</p>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>${L.hItem}</th><th class="num">${L.hGz}</th><th class="num">${L.hF}</th><th class="num">${L.hRy}</th>
            </tr></thead>
            <tbody>
              ${MODEL.C.map((r, i) => rowC(r, i)).join('')}
              <tr><td>${L.C_amort}</td><td class="num">US$${fm2(AMORT_USD)}<span class="ry-ref">SAR ${fm2(AMORT_USD * S)} · ¥${fm2(AMORT_CNY)}</span></td><td class="num"></td><td class="num">${cnyCell(AMORT_CNY)}</td></tr>
              <tr class="grand-total"><td>${L.C_total}</td><td class="num">${cBase}<span class="ry-ref">${L.C_base} ¥${fm2(BASE_TOTAL_CNY)}</span></td><td class="num"></td><td class="num">${cTotal}</td></tr>
            </tbody>
          </table>
        </div>
        <p class="ry-margin">${L.C_margin}</p>
      </div>

      <!-- Summary -->
      <div class="section">
        <h2 class="section-title">${L.sumT}</h2>
        <div class="stat-grid">
          <div class="stat-block stat-block-accent">
            <div class="stat-block-value">SAR ${cp(LANDED * S)}<span class="ref">US$${cp(LANDED)} · ¥${cp(LANDED * U)}</span></div>
            <div class="stat-block-label">${L.s1t}</div>
            <div class="ry-stat-note">${L.s1n}</div>
          </div>
          <div class="stat-block">
            <div class="stat-block-value">SAR ${cp(B_SUB * S)}<span class="ref">US$${cp(B_SUB)} · ¥${cp(B_SUB * U)}</span></div>
            <div class="stat-block-label">${L.s2t}</div>
            <div class="ry-stat-note">${L.s2n}</div>
          </div>
          <div class="stat-block">
            <div class="stat-block-value">SAR ${cp(STARTUP_RIYADH * S)}<span class="ref">US$${cp(STARTUP_RIYADH)} · ¥${cp(STARTUP_RIYADH * U)}</span></div>
            <div class="stat-block-label">${L.s3t}</div>
            <div class="ry-stat-note">${L.s3n} · <b style="color:var(--orange)">+${fm2(UPLIFT)}% vs Guangzhou</b></div>
          </div>
          <div class="stat-block" style="border-color: var(--green);">
            <div class="stat-block-value" style="color: var(--green);">SAR ${fm2(TOTAL_SAR)}<span class="ref">US$${fm2(TOTAL_USD)} · ¥${fm2(TOTAL_CNY)}</span></div>
            <div class="stat-block-label">${L.s4t}</div>
            <div class="ry-stat-note">${L.s4n}</div>
          </div>
        </div>
        <p class="fx-note">${L.disclaimer}</p>
      </div>

      <!-- Assumptions -->
      <div class="section" style="margin-bottom: 0;">
        <h2 class="section-title">${L.assT}</h2>
        <ul class="ry-assump">
          ${L.ass.map(a => `<li>${a}</li>`).join('')}
        </ul>
        <p style="margin-top: 26px;"><a class="ry-back" href="costs.html">${L.ctaCosts}</a></p>
      </div>
    `;
  }

  // Auth gate — AUTH.init() reveals content + calls renderRiyadhContent after login
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof AUTH !== 'undefined' && AUTH.isAuthenticated()) {
      AUTH.revealContent();
      AUTH._renderCosts();
    }
  });
  </script>
</body>
