  <style>
    /* ── Specialty-only rule — the cost gate that decides what this site is about ── */
    .sp-rule { background: linear-gradient(135deg, rgba(244,33,46,0.09), rgba(212,160,23,0.08)); border: 1px solid rgba(244,33,46,0.30); border-radius: var(--radius-md); padding: 20px 22px; }
    .sp-rule-k { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--red); text-transform: uppercase; margin-bottom: 10px; }
    .sp-rule-p { font-size: 15.5px; font-weight: 600; line-height: 1.7; color: var(--text-primary); }
    .comp-table tr.sp-no td { background: rgba(244,33,46,0.05); }
    .comp-table tr.sp-no td.sp-v { color: var(--red); }
    .comp-table tr.sp-yes td { background: rgba(0,186,124,0.06); }
    .comp-table tr.sp-yes td.sp-v { color: var(--green); font-weight: 600; }
    body.rtl .comp-table th, body.rtl .comp-table td { text-align: right; }
    .sp-engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 22px; }
    .sp-engine { background: var(--bg-card); border: 1px solid var(--border-color); border-top: 3px solid var(--green); border-radius: var(--radius-md); padding: 22px; }
    .sp-engine h3 { font-size: 16px; color: var(--text-primary); margin-bottom: 10px; }
    .sp-engine p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.75; }
    .sp-engine-anchor { border-top-color: #d4a017; }
  </style>
